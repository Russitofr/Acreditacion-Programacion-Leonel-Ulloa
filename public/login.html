<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de administración - ULAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .login-card {
            width: 90%;
            max-width: 380px;
            padding: 2.5rem;
            border-radius: 16px;
        }
        .login-card h1 {
            font-family: 'Oswald', sans-serif;
            color: var(--accent);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .login-card form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .login-card .btn {
            width: 100%;
            margin-top: .5rem;
        }
        .login-back {
            display: block;
            margin-top: 1.2rem;
            color: var(--text-muted);
            text-align: center;
            text-decoration: none;
        }
        .login-back:hover { color: var(--accent); }
    </style>
</head>
<body class="login-page">
    <main class="login-card glow-card">
        <h1>Panel de Administración</h1>
        <form id="form-login">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Ingresar</button>
            <p id="mensaje-error" class="mensaje-error" role="status"></p>
        </form>
        <a class="login-back" href="/">Volver al sitio</a>
    </main>

    <script>
        const formulario = document.getElementById('form-login');
        const mensaje = document.getElementById('mensaje-error');

        formulario.addEventListener('submit', async event => {
            event.preventDefault();
            mensaje.textContent = '';

            try {
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario: document.getElementById('usuario').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(resultado.error || 'No se pudo iniciar sesión.');
                }

                window.location.href = '/admin.html';
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
